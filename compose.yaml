services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nodo
      POSTGRES_USER: nodo
      POSTGRES_PASSWORD: nodo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nodo -d nodo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
